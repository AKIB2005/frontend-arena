<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="description"
      content="Find scholarships you actually qualify for, understand your match, and track every deadline."
    />
    <meta
      property="og:title"
      content="Grantly: find scholarships you actually qualify for"
    />
    <meta
      property="og:description"
      content="Personalised scholarship matching with clear eligibility and a simple tracker."
    />
    <meta property="og:type" content="website" />
    <title>Grantly: find scholarships you actually qualify for</title>
    <script>
      try {
        var t = localStorage.getItem('grantly-theme')
        var dark =
          t === 'dark' ||
          (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0A0A0A' : '#FFFFFF')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
